# Локальная разработка. Секреты берутся из .env рядом с этим файлом
# (см. .env.example). Синтаксис ${VAR:?...} роняет compose с внятной ошибкой,
# если переменная не задана, - лучше, чем стартовать с пустым ключом.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edu-main-service
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=learnizy-backend
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/educational_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-eduuser}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан, см. .env.example}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET не задан, см. .env.example}
      # Читаются как jwt.expiration.access / jwt.expiration.refresh.
      # Прежний JWT_EXPIRATION не соответствовал ни одному ключу конфигурации.
      - JWT_EXPIRATION_ACCESS=${JWT_EXPIRATION_ACCESS:-3600000}
      - JWT_EXPIRATION_REFRESH=${JWT_EXPIRATION_REFRESH:-86400000}
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      # Бэкенд читает два отдельных бакета; MINIO_BUCKET_NAME не использовался.
      - MINIO_VOICE_BUCKET_NAME=voice-responses
      - MINIO_MEDIA_BUCKET_NAME=media-files
      - MINIO_REGION=us-east-1
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD не задан, см. .env.example}
      - SPRING_CACHE_TYPE=redis
      - FRONTEND_RESET_PASSWORD_URL=${FRONTEND_RESET_PASSWORD_URL:-http://localhost:3000/reset-password}
      - PASSWORD_RESET_TOKEN_EXPIRY_MINUTES=60
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      # Хосты поднимаются профилями whisper / ai (см. README).
      - WHISPER_API_URL=http://whisper-service:8080
      - AI_API_URL=http://ai-service:8090
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1g
    restart: unless-stopped

  db:
    image: postgres:17.5-alpine
    container_name: edu-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-eduuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан, см. .env.example}
      - POSTGRES_DB=educational_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduuser} -d educational_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    shm_size: "256m"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    container_name: edu-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # MINIO_DEFAULT_BUCKETS - переменная bitnami-образа, официальный minio её
    # игнорирует. Бакеты создаёт сам бэкенд (FileStorageServiceImpl.init).
    volumes:
      - minio_data:/data
    networks:
      - app-network
    command: server /data --console-address ":9001"
    mem_limit: 1g
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: edu-redis
    hostname: redis
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD не задан, см. .env.example}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" PING | grep -q PONG" ]
      interval: 5s
      timeout: 10s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.7.0
    container_name: edu-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pxel.software}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    mem_limit: 512m
    restart: unless-stopped
    profiles:
      - tools

  ai-service:
    build:
      context: ../learnizy-proxyapi-service
      dockerfile: Dockerfile
    container_name: edu-proxyapi-service
    ports:
      - "8090:8090"
    networks:
      - app-network
    mem_limit: 1g
    restart: unless-stopped
    environment:
      - PROXYAPI_BASE_URL=${PROXYAPI_BASE_URL:-https://api.proxyapi.ru/openai/v1}
      - PROXYAPI_API_KEY=${PROXYAPI_API_KEY:-}
    profiles:
      - ai

  # Бэкенд ходит в whisper по адресу http://whisper-service:8080 (Feign,
  # whisperApiClient). Раньше сервиса в этом compose не было вовсе.
  # Образ тяжёлый (torch + ffmpeg), поэтому вынесен в отдельный профиль.
  whisper-service:
    build:
      context: ../learnizy-whisper-service
      dockerfile: Dockerfile
    container_name: edu-whisper-service
    ports:
      - "8085:8080"
    environment:
      - WHISPER_MAX_DOWNLOAD_MB=${WHISPER_MAX_DOWNLOAD_MB:-50}
      - WHISPER_MODEL_NAME=${WHISPER_MODEL_NAME:-small}
    volumes:
      - whisper_cache:/home/app/.cache/whisper
    networks:
      - app-network
    mem_limit: 2g
    restart: unless-stopped
    profiles:
      - whisper

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: edu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - app-network
    mem_limit: 1g
    restart: unless-stopped
    profiles:
      - monitoring

  loki:
    image: grafana/loki:3.5.5
    container_name: edu-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    mem_limit: 1g
    restart: unless-stopped
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:3.5.5
    container_name: edu-promtail
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network
    mem_limit: 256m
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:12.3.0-18179386486
    container_name: edu-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - prometheus
      - loki
    mem_limit: 512m
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
  pgadmin_data:
  grafana_data:
  whisper_cache:
