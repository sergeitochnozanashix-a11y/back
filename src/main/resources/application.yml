spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/educational_db}
    username: ${SPRING_DATASOURCE_USERNAME:eduuser}
    password: ${SPRING_DATASOURCE_PASSWORD:edupassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 30MB
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Без явных таймаутов JavaMail ждёт ответа SMTP бесконечно, и запрос
          # регистрации зависает вместо того, чтобы быстро вернуть ответ с
          # emailSent=false. Пять секунд с запасом хватает живому SMTP.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  application:
    name: learnizy-backend

jwt:
  refreshToken:
    cookie-name: refresh_token
  secret: ${JWT_SECRET}
  expiration:
    access: ${JWT_EXPIRATION_ACCESS:3600000}
    refresh: ${JWT_EXPIRATION_REFRESH:86400000}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  voiceBucketName: ${MINIO_VOICE_BUCKET_NAME:voice-responses}
  mediaBucketName: ${MINIO_MEDIA_BUCKET_NAME:media-files}
  region: ${MINIO_REGION:us-east-1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

logging:
  level:
    root: INFO
    software.pxel: INFO

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  error:
    include-stacktrace: never
    include-message: always
  forward-headers-strategy: FRAMEWORK

app:
  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:https://edu.pxel.software/reset-password}
password:
  reset:
    token-expiry-minutes: ${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:30}

feign:
  client:
    config:
      aiApiClient:
        url: ${AI_API_URL:http://localhost:8090}
        connectTimeout: 5000
        readTimeout: 420000
        loggerLevel: basic
      whisperApiClient:
        url: ${WHISPER_API_URL:http://localhost:8085}
        connectTimeout: 5000
        readTimeout: 420000
        loggerLevel: basic

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  metrics:
    tags:
      application: ${spring.application.name}
